<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAPOR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            color: #00ff88;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            pointer-events: none;
        }

        .logo {
            font-size: 120px;
            font-weight: bold;
            letter-spacing: 20px;
            text-shadow:
                0 0 20px #ff006e,
                0 0 40px #ff006e,
                0 0 60px #8338ec,
                0 0 80px #3a86ff;
            margin-bottom: 30px;
            animation: neonFlicker 0.1s infinite;
            transition: transform 0.05s ease-out, text-shadow 0.1s ease-out;
        }

        @keyframes neonFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow:
                    0 0 20px #ff006e,
                    0 0 40px #ff006e,
                    0 0 60px #8338ec,
                    0 0 80px #3a86ff;
                color: #00ff88;
            }
            20%, 24%, 55% {
                text-shadow:
                    0 0 10px #ff006e,
                    0 0 20px #8338ec;
                color: #00cc66;
            }
        }

        .tagline {
            font-size: 20px;
            letter-spacing: 3px;
            margin-bottom: 50px;
            color: #ff006e;
            text-shadow: 0 0 10px #ff006e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .controls {
            pointer-events: auto;
            margin-top: 50px;
        }

        .button {
            background: linear-gradient(135deg, #8338ec 0%, #3a86ff 100%);
            border: 2px solid #00ff88;
            color: #00ff88;
            padding: 15px 40px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            margin: 0 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px #8338ec;
            text-shadow: 0 0 10px #00ff88;
        }

        .button:hover {
            background: linear-gradient(135deg, #ff006e 0%, #8338ec 100%);
            border-color: #ff006e;
            color: #00ff88;
            box-shadow: 0 0 40px #ff006e;
            transform: scale(1.05);
        }

        .button:active {
            transform: scale(0.95);
        }

        .audio-player {
            pointer-events: auto;
            margin-top: 40px;
            background: rgba(255, 0, 110, 0.1);
            border: 2px solid #ff006e;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.3);
        }

        audio {
            width: 100%;
            max-width: 400px;
            filter: drop-shadow(0 0 10px #ff006e);
        }

        .info {
            margin-top: 60px;
            font-size: 14px;
            color: #3a86ff;
            letter-spacing: 1px;
            max-width: 400px;
        }

        .vaportext {
            font-size: 14px;
            color: #00ff88;
            margin-top: 20px;
            animation: glitch 2s infinite;
        }

        @keyframes glitch {
            0%, 100% {
                color: #00ff88;
                text-shadow: 0 0 10px #00ff88;
            }
            50% {
                color: #ff006e;
                text-shadow: 0 0 10px #ff006e;
            }
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(0deg, transparent 24%, rgba(255, 0, 110, 0.05) 25%, rgba(255, 0, 110, 0.05) 26%, transparent 27%, transparent 74%, rgba(255, 0, 110, 0.05) 75%, rgba(255, 0, 110, 0.05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(255, 0, 110, 0.05) 25%, rgba(255, 0, 110, 0.05) 26%, transparent 27%, transparent 74%, rgba(255, 0, 110, 0.05) 75%, rgba(255, 0, 110, 0.05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
            animation: scroll 8s linear infinite;
        }

        @keyframes scroll {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(50px);
            }
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    <canvas id="canvas"></canvas>
    <div class="scanlines"></div>

    <div class="container">
        <div class="logo">VAPOR</div>
        <div class="tagline">// COMING SOON //</div>

        <div class="audio-player">
            <audio controls loop>
                <source src="audio.wav" type="audio/wav">
                Your browser does not support the audio element.
            </audio>
        </div>

        <div class="controls">
            <button class="button" onclick="toggleFullscreen()">⚡ IMMERSE ⚡</button>
        </div>

        <div class="info">
            <div>A synthwave experience</div>
            <div class="vaportext">▒▒▒ LOADING DREAMS ▒▒▒</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const audio = document.querySelector('audio');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Audio analysis setup
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let beatIntensity = 0;
        let bassIntensity = 0;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaElementAudioSource(audio);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
        }

        function updateBeatData() {
            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);

            // Bass detection (low frequencies)
            const bassEnd = Math.floor(dataArray.length * 0.1);
            let bass = 0;
            for (let i = 0; i < bassEnd; i++) {
                bass += dataArray[i];
            }
            bassIntensity = (bass / (bassEnd * 255)) * 2;

            // Overall beat intensity
            let total = 0;
            for (let i = 0; i < dataArray.length; i++) {
                total += dataArray[i];
            }
            beatIntensity = Math.min((total / (dataArray.length * 255)) * 3, 1);
        }

        audio.addEventListener('play', initAudio);

        // Particle system for atmosphere
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = Math.random() * 0.5 + 0.2;
                this.size = Math.random() * 2 + 0.5;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.color = ['#ff006e', '#8338ec', '#3a86ff', '#00ff88'][Math.floor(Math.random() * 4)];
            }

            update() {
                this.x += this.vx;
                this.y -= this.vy;
                this.opacity -= 0.002;

                if (this.y < 0 || this.opacity <= 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                    this.opacity = Math.random() * 0.5 + 0.3;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity * (1 + beatIntensity * 0.5);
                ctx.fillRect(this.x, this.y, this.size * (1 + beatIntensity * 2), this.size * (1 + beatIntensity * 2));
            }
        }

        const particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }

        // Beat-reactive colors
        const colors = ['#ff006e', '#8338ec', '#3a86ff', '#00ff88', '#ff3366'];
        let colorIndex = 0;

        // Mountains/Hills for perspective effect
        function drawMountains() {
            ctx.globalAlpha = 1;
            const now = Date.now();
            const beatPulse = 1 + beatIntensity * 0.3;

            // Far mountains
            const color1 = beatIntensity > 0.5 ? 'rgba(255, 51, 102, 0.2)' : 'rgba(255, 0, 110, 0.1)';
            ctx.fillStyle = color1;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.6);
            for (let x = 0; x < canvas.width; x += 20) {
                const y = canvas.height * 0.6 + Math.sin(x * 0.01 + now * 0.0002) * (30 + bassIntensity * 40);
                ctx.lineTo(x, y);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();

            // Mid mountains
            const color2 = beatIntensity > 0.6 ? 'rgba(131, 56, 236, 0.25)' : 'rgba(131, 56, 236, 0.15)';
            ctx.fillStyle = color2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.5);
            for (let x = 0; x < canvas.width; x += 30) {
                const y = canvas.height * 0.5 + Math.sin(x * 0.005 + now * 0.0003) * (40 + bassIntensity * 50);
                ctx.lineTo(x, y);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();

            // Neon grid lines - beat reactive
            const gridAlpha = 0.2 + beatIntensity * 0.3;
            const gridColor = beatIntensity > 0.7 ? `rgba(255, 0, 110, ${gridAlpha})` : `rgba(58, 134, 255, ${gridAlpha})`;
            ctx.strokeStyle = gridColor;
            ctx.lineWidth = 1 + beatIntensity * 2;
            for (let i = 0; i < 20; i++) {
                const y = canvas.height * 0.4 + i * canvas.height * 0.02;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        // Animation loop
        function animate() {
            updateBeatData();

            // Beat-reactive background
            const bgAlpha = 0.1 + beatIntensity * 0.15;
            ctx.fillStyle = `rgba(10, 14, 39, ${bgAlpha})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawMountains();

            for (let particle of particles) {
                particle.update();
                particle.draw();
            }

            ctx.globalAlpha = 1;

            // Beat-reactive flash
            if (beatIntensity > 0.7) {
                const flashColor = colors[Math.floor(Date.now() / 100) % colors.length];
                ctx.fillStyle = `${flashColor}15`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Beat circle effect at center
            if (beatIntensity > 0.5) {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = 50 + beatIntensity * 200;
                ctx.strokeStyle = `rgba(255, 0, 110, ${0.3 * beatIntensity})`;
                ctx.lineWidth = 2 + beatIntensity * 4;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Bass-reactive vertical lines
            if (bassIntensity > 0.3) {
                ctx.strokeStyle = `rgba(58, 134, 255, ${bassIntensity * 0.5})`;
                ctx.lineWidth = 2 + bassIntensity * 8;
                const spacing = Math.max(20, 100 - bassIntensity * 100);
                for (let x = 0; x < canvas.width; x += spacing) {
                    ctx.beginPath();
                    ctx.moveTo(x, canvas.height * 0.3);
                    ctx.lineTo(x, canvas.height * 0.7 + bassIntensity * 100);
                    ctx.stroke();
                }
            }

            requestAnimationFrame(animate);
        }

        animate();

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Beat-reactive DOM elements
        const logo = document.querySelector('.logo');
        const tagline = document.querySelector('.tagline');

        function updateUIBeat() {
            // Scale logo with beat
            const scale = 1 + beatIntensity * 0.2 + bassIntensity * 0.15;
            logo.style.transform = `scale(${scale})`;

            // Color shift with beat
            if (beatIntensity > 0.6) {
                logo.style.textShadow = `
                    0 0 ${20 + beatIntensity * 30}px #ff3366,
                    0 0 ${40 + beatIntensity * 40}px #ff3366,
                    0 0 ${60 + beatIntensity * 50}px #ff006e,
                    0 0 ${80 + beatIntensity * 60}px #3a86ff
                `;
                tagline.style.color = '#ff3366';
            } else {
                logo.style.textShadow = `
                    0 0 ${20 + beatIntensity * 15}px #ff006e,
                    0 0 ${40 + beatIntensity * 20}px #ff006e,
                    0 0 ${60 + beatIntensity * 25}px #8338ec,
                    0 0 ${80 + beatIntensity * 30}px #3a86ff
                `;
                tagline.style.color = '#ff006e';
            }

            requestAnimationFrame(updateUIBeat);
        }

        updateUIBeat();

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyF') {
                toggleFullscreen();
            }
        });
    </script>
</body>
</html>
